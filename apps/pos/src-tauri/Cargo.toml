[package]
name = "floor-pos"
version = "0.1.0"
description = "Floor Linux register"
authors = ["Floor"]
edition = "2021"

[lib]
name = "floor_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
qrcode = "0.14"
