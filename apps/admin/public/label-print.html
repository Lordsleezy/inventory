<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print label</title>
  <style>
    html, body { margin: 0; background: #fff; color: #111; font: 16px/1.4 sans-serif; }
    .bar { display: flex; gap: 8px; padding: 12px; position: sticky; top: 0; background: #fff; }
    button, a { flex: 1; min-height: 52px; font-size: 18px; border-radius: 10px; border: 1px solid #111; background: #111; color: #fff; }
    a { background: #fff; color: #111; text-align: center; line-height: 52px; text-decoration: none; }
    p { margin: 0; padding: 0 12px 12px; }
    img { display: block; width: 100%; height: auto; background: #fff; }
    @page { size: 4in 6in; margin: 0; }
    @media print {
      .bar, p { display: none !important; }
      img { width: 4in; height: 6in; object-fit: contain; break-after: page; page-break-after: always; }
      img:last-of-type { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" id="print">Print</button>
    <a id="back" href="/">Back</a>
  </div>
  <p id="status">Opening the printer…</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var letter = params.get('paper') === 'letter';
      var srcs = params.getAll('src').filter(Boolean);
      var status = document.getElementById('status');
      if (letter) {
        var style = document.createElement('style');
        style.textContent = '@page { size: letter; margin: 0; } @media print { img { width: 8.5in; height: 11in; } }';
        document.head.appendChild(style);
      }
      document.getElementById('print').addEventListener('click', function () { window.print(); });
      document.getElementById('back').addEventListener('click', function (event) {
        if (history.length > 1) { event.preventDefault(); history.back(); }
      });
      if (!srcs.length) {
        status.textContent = 'The label did not come through. Go back and tap Print again.';
        return;
      }
      var pending = srcs.length;
      srcs.forEach(function (src) {
        var img = document.createElement('img');
        img.alt = 'Shipping label';
        img.onload = function () {
          pending -= 1;
          if (pending <= 0) window.print();
        };
        img.onerror = function () {
          status.textContent = 'The label did not load. Go back and tap Print again.';
        };
        img.src = src;
        document.body.appendChild(img);
      });
    })();
  </script>
</body>
</html>
