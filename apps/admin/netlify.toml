[build]
  # When Netlify package directory is apps/admin, cwd is that folder — publish relative to it.
  # Root-linked deploys still work via `npm run build -w` from the monorepo root.
  command = "cd ../.. && npm run build -w @floor/admin"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/admin/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
