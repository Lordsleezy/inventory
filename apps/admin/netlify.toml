[build]
  command = "npm run build -w @floor/admin"
  publish = "apps/admin/dist"
  # Production publishes from the release branch, once a day at 6:00 Pacific.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ]; then exit 1; fi; if git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/admin packages shared package.json package-lock.json; then exit 0; else exit 1; fi'

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/admin/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Same-origin proxy so the locked-down store phone (admin.openboxindustries.com only)
# can call inventoryobi functions without opening cross-origin fetch.
[[redirects]]
  from = "/api/floor/*"
  to = "https://inventoryobi.netlify.app/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
