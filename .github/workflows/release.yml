name: release

# Cutting a new installer:
#   npm version patch -m "Floor %s"   (or edit package.json)
#   git push && git push --tags
# The tag is what triggers this. Or run it by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Defaults to package.json."
        required: false

permissions:
  contents: write

jobs:
  installer:
    # Jammy matches Zorin 17's Ubuntu base, so anything native we touch links
    # against a glibc no newer than the Surface has.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner is x64
        run: |
          test "$(uname -m)" = "x86_64" || { echo "runner is not x64"; exit 1; }
          echo "PASS  $(uname -m)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PASS  building $VERSION"

      - name: Build the installer
        run: |
          chmod +x installer/make-run.sh installer/make-windows.sh
          installer/make-run.sh "${{ steps.v.outputs.version }}"
          installer/make-windows.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: floor-${{ steps.v.outputs.version }}
          path: |
            build/floor-*.run
            build/floor-*.run.sha256
            build/floor-*-windows.zip
            build/floor-*-windows.zip.sha256
          retention-days: 30

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          RUN="build/floor-${VERSION}-linux-x64.run"
          WIN="build/floor-${VERSION}-windows.zip"
          {
            echo "## Floor ${VERSION}"
            echo
            echo "### Linux x64 (Zorin tablet)"
            echo
            echo "Download \`floor-${VERSION}-linux-x64.run\`, then:"
            echo
            echo '```bash'
            echo "cd ~/Downloads"
            echo "sudo bash floor-${VERSION}-linux-x64.run"
            echo '```'
            echo
            echo "Use \`sudo bash\`, not \`sudo ./file\`. Inventory and PIN stay outside the program directory on update."
            echo
            echo "### Windows ARM64 and x64"
            echo
            echo "Download \`floor-${VERSION}-windows.zip\`, unzip, then in that folder:"
            echo
            echo '```powershell'
            echo "Set-ExecutionPolicy -Scope Process Bypass"
            echo ".\Install-Floor.ps1"
            echo '```'
            echo
            echo "Needs Docker Desktop. On ARM64 use the ARM64 Docker build; InvenTree's image is linux/arm64. Later starts: \`.\Start-Floor.ps1\`. Read \`README.md\` inside the zip."
            echo
            echo "### Checksums"
            echo '```'
            cat "${RUN}.sha256"
            cat "${WIN}.sha256"
            echo '```'
          } > notes.md

          gh release create "v${VERSION}" \
            "$RUN" "${RUN}.sha256" \
            "$WIN" "${WIN}.sha256" \
            --title "Floor ${VERSION}" \
            --notes-file notes.md \
            --latest
