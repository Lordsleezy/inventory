# Signing uses the Apple Developer Portal API key named Forge-Lite
# (Teams → Integrations → Developer Portal). Do not commit certs.
# Team ID 4SRR4NV35F. Bundle ID com.openboxindustries.floor.
# Trigger: tag ios-* or a manual run.
#
# ios_signing is intentionally omitted. That block only matches profiles
# uploaded under Codemagic → Code signing identities, which is why the
# previous builds failed with "No matching profiles found" even though
# Apple can list the Distribution cert, but Codemagic cannot use it without
# the matching private key. CERTIFICATE_PRIVATE_KEY lives in the Codemagic
# variable group named appstore (full RSA PEM).

workflows:
  ios-capacitor:
    name: Floor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Forge-Lite
    triggering:
      events:
        - tag
        - push
      tag_patterns:
        - pattern: ios-*
          include: true
      branch_patterns:
        - pattern: square-v1
          include: true
    environment:
      groups:
        - appstore
      vars:
        XCODE_PROJECT: "apps/adapter/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.openboxindustries.floor"
        APPLE_TEAM_ID: "4SRR4NV35F"
        APP_STORE_CONNECT_TEAM_ID: "4SRR4NV35F"
        # Numeric Apple ID from App Store Connect → Floor → App Information → Apple ID.
        # Also set this in the Codemagic group appstore if you prefer not to keep it here.
        # APP_STORE_APP_ID: "1234567890"
        # Also required in group appstore (public, baked into the IPA):
        # VITE_SUPABASE_URL=https://zoukmsmbztcuyoslvikp.supabase.co
        # VITE_SUPABASE_ANON_KEY, VITE_FUNCTIONS_URL
        # Required for MobilePaymentsSDK.initialize (public Square Application ID):
        # SQUARE_APPLICATION_ID
      xcode: latest
      node: 22.18.0
    scripts:
      - name: npm
        script: |
          npm ci
          npm run test:store
      - name: Require VITE env
        script: |
          set -e
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_FUNCTIONS_URL; do
            eval "val=\${$v-}"
            if [ -n "$val" ]; then
              echo "$v is set"
            else
              echo "$v is EMPTY" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Those VITE_* vars must be in the Codemagic group named appstore (this workflow already imports it)." >&2
            echo "App settings → Environment variables → group appstore. Rebuild latest master after saving." >&2
            exit 1
          fi
      - name: Bundle phone UI
        script: |
          npm run build -w @floor/mobile
          test -f apps/adapter/www/index.html
          if grep -E 'url:[[:space:]]*["'\'']https?://' apps/adapter/capacitor.config.ts; then
            echo "Capacitor must not set server.url to a remote host" >&2
            exit 1
          fi
          if ! grep -Rql --include='*.js' 'zoukmsmbztcuyoslvikp' apps/adapter/www; then
            echo "Built www/ did not inline VITE_SUPABASE_URL; cap sync would ship an empty client." >&2
            exit 1
          fi
          echo "www/ is ready for cap sync (webDir=www)"
      - name: Capacitor iOS project
        script: |
          cd apps/adapter
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          bash ../../scripts/ios-prepare.sh
          # SQUARE_APPLICATION_ID from Codemagic group appstore (public Square app id).
          export SQUARE_APPLICATION_ID="${SQUARE_APPLICATION_ID:-}"
          bash ../../scripts/ios-square-prepare.sh
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install)
          fi
          cd ../..
          test -d "$XCODE_PROJECT"
          # Prove CapApp-SPM pulled FloorSquare + Square SDK as a *direct* product
          # (transitive-only does not reliably embed the XCFramework in the IPA).
          grep -q FloorSquarePlugin apps/adapter/ios/App/CapApp-SPM/Package.swift
          grep -q SquareMobilePaymentsSDK apps/adapter/ios/App/CapApp-SPM/Package.swift
          grep -q MockReaderUI apps/adapter/ios/App/CapApp-SPM/Package.swift
          grep -q mobile-payments-sdk-ios apps/adapter/ios/App/CapApp-SPM/Package.swift
          grep -q MockReaderUI packages/square-plugin/Package.swift
          grep -q mobile-payments-sdk-ios packages/square-plugin/Package.swift
          grep -q SquareMobilePaymentsSDK packages/square-plugin/Package.swift
          grep -q FloorSquarePlugin apps/adapter/ios/App/App/capacitor.config.json \
            || grep -q FloorSquarePlugin apps/adapter/ios/App/CapApp-SPM/Package.swift
          if [ -z "${SQUARE_APPLICATION_ID:-}" ] || [ "${SQUARE_APPLICATION_ID}" = "REPLACE_ME" ]; then
            echo "SQUARE_APPLICATION_ID must be set in Codemagic group appstore" >&2
            exit 1
          fi
          echo "PASS  CapApp-SPM declares FloorSquare + SquareMobilePaymentsSDK + MockReaderUI; SQUARE_APPLICATION_ID set"
      - name: Resolve Swift packages (prove SDK links)
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            | tee /tmp/spm-resolve.log
          # Resolved package graph must include Square's Mobile Payments SDK.
          if ! grep -Eiq 'mobile-payments-sdk-ios|SquareMobilePaymentsSDK' /tmp/spm-resolve.log \
            && ! find ~/Library/Developer/Xcode/DerivedData -name 'SquareMobilePaymentsSDK*' 2>/dev/null | head -1 | grep -q .; then
            # xcodebuild -resolvePackageDependencies output varies; also check Package.resolved if present
            if ! find apps/adapter/ios -name 'Package.resolved' -print0 | xargs -0 grep -l mobile-payments-sdk-ios 2>/dev/null | head -1 | grep -q .; then
              echo "Square Mobile Payments SDK did not resolve into the Xcode package graph" >&2
              echo "--- spm-resolve.log (tail) ---" >&2
              tail -80 /tmp/spm-resolve.log >&2 || true
              exit 1
            fi
          fi
          echo "PASS  Square Mobile Payments SDK resolved"
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files from Apple
        script: |
          echo "Signing-related environment variable names:"
          env | awk -F= '{print $1}' | grep -Ei 'CERT|SIGN|KEY_ID|ISSUER|BUNDLE|APPLE' | sort || true
          echo "CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is empty in this build." >&2
            echo "It must live in the Codemagic variable group named exactly: appstore" >&2
            echo "Then start a new build of latest master so that group is imported." >&2
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Use signing profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment CFBundleVersion
        script: |
          set -eo pipefail
          PLIST="apps/adapter/ios/App/App/Info.plist"
          PBX="apps/adapter/ios/App/App.xcodeproj/project.pbxproj"
          IOS_APP="apps/adapter/ios/App"
          test -f "$PLIST"
          test -f "$PBX"
          LATEST=$(app-store-connect get-latest-testflight-build-number "${APP_STORE_APP_ID:-}" 2>/dev/null || echo 0)
          LATEST=$(printf '%s' "$LATEST" | tr -dc '0-9')
          LATEST=${LATEST:-0}
          NEW=$((LATEST + 1))
          # fallback so it's always higher even if the lookup fails
          if [ "$NEW" -le 1 ]; then NEW=$(date +%Y%m%d%H%M); fi
          (cd "$IOS_APP" && agvtool new-version -all "$NEW")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW" "$PLIST"
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" "$PBX"
          rm -f "$PBX.bak"
          echo "Build number set to $NEW"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          grep CURRENT_PROJECT_VERSION "$PBX"
      - name: Build IPA
        script: |
          test -d "$XCODE_PROJECT"
          xcodebuild -project "$XCODE_PROJECT" -list
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify Square SDK is inside the IPA
        script: |
          set -euo pipefail
          # Manifest checks already ran; this fails the build if the XCFramework
          # did not actually land in the app binary (the ios-square-6 failure mode).
          IPA="$(ls -1t build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)"
          if [ -z "$IPA" ]; then
            IPA="$(find . -path '*/build/ios/ipa/*.ipa' -o -path '*/ios/ipa/*.ipa' 2>/dev/null | head -1 || true)"
          fi
          bash scripts/verify-ios-square-ipa.sh "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          -  pgg124@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
