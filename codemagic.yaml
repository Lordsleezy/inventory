# Signing uses the Apple Developer Portal API key named Forge-Lite
# (Teams → Integrations → Developer Portal). Do not commit certs.
# Team ID 4SRR4NV35F. Bundle ID com.openboxindustries.floor.
# Trigger: tag ios-* or a manual run.
#
# ios_signing is intentionally omitted. That block only matches profiles
# uploaded under Codemagic → Code signing identities, which is why the
# previous builds failed with "No matching profiles found" even though
# Apple can list the Distribution cert, but Codemagic cannot use it without
# the matching private key. Set CERTIFICATE_PRIVATE_KEY as a secret in
# Codemagic → Environment variables (the RSA PEM, including BEGIN/END lines).

workflows:
  ios-capacitor:
    name: Floor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Forge-Lite
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-*
          include: true
    environment:
      vars:
        XCODE_WORKSPACE: "apps/adapter/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.openboxindustries.floor"
        APPLE_TEAM_ID: "4SRR4NV35F"
        APP_STORE_CONNECT_TEAM_ID: "4SRR4NV35F"
      xcode: latest
      node: 22.18.0
    scripts:
      - name: npm
        script: |
          npm ci
          npm run test:store
      - name: Bundle phone UI
        script: |
          npm run build -w @floor/mobile
          test -f apps/adapter/www/index.html
          if grep -E '^[[:space:]]*server:' apps/adapter/capacitor.config.ts; then
            echo "Capacitor must not load a remote host; remove the server block" >&2
            exit 1
          fi
      - name: Capacitor iOS project
        script: |
          cd apps/adapter
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          bash ../../scripts/ios-prepare.sh
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files from Apple
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Add CERTIFICATE_PRIVATE_KEY as a secret in Codemagic → Environment variables, then rebuild." >&2
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          -  pgg124@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
