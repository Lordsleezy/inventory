# Standalone Floor iOS IPA. UI is bundled in the app (apps/adapter/www).
# The Surface is JSON API + InvenTree only — not a website the WebView loads.
#
# Signing — set these in the Codemagic UI. Do not commit certs, PIN, or floor.env.
#   CM_CERTIFICATE              — distribution (or development) .p12, base64
#   CM_CERTIFICATE_PASSWORD     — p12 password
#   CM_PROVISIONING_PROFILE     — profile for com.openboxindustries.floor, base64
# Optional:
#   FLOOR_API_URL               — default API origin baked into www/config.json
#                                 (e.g. http://192.168.68.51:3000). Phone can still
#                                 change it. Never put this in capacitor server.url.
#
# Team ID 4SRR4NV35F. Bundle ID com.openboxindustries.floor.
# Trigger: tag ios-* or a manual run.

workflows:
  ios-capacitor:
    name: Floor iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-*
          include: true
    environment:
      vars:
        XCODE_WORKSPACE: "apps/adapter/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.openboxindustries.floor"
        APPLE_TEAM_ID: "4SRR4NV35F"
        FLOOR_API_URL: "http://192.168.68.51:3000"
      xcode: latest
      node: 22.18.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.openboxindustries.floor
    scripts:
      - name: npm
        script: |
          npm ci
      - name: Bundle phone UI
        script: |
          npm run build -w @floor/mobile
          test -f apps/adapter/www/index.html
          if grep -E '^[[:space:]]*server:' apps/adapter/capacitor.config.ts; then
            echo "Capacitor must not load a remote host; remove the server block" >&2
            exit 1
          fi
      - name: Capacitor iOS project
        script: |
          cd apps/adapter
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          bash ../../scripts/ios-prepare.sh
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients: []
        notify:
          success: false
          failure: true
