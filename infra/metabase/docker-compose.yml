services:
  metabase:
    image: metabase/metabase:v0.52.6
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      # Optional: external app DB for Metabase's own storage
      # MB_DB_TYPE: postgres
      # MB_DB_CONNECTION_URI: ${MB_APP_DATABASE_URL}
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data:
