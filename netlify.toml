[build]
  command = "npm install --prefix netlify --omit=dev"
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/5 * * * *"

[functions."loyalty-email"]
  schedule = "*/5 * * * *"

[functions."web-order-email"]
  schedule = "*/5 * * * *"

[functions."web-order-reconcile"]
  schedule = "*/5 * * * *"

[functions."web-pickup-sweep"]
  schedule = "*/10 * * * *"

[functions."listing-check"]
  schedule = "0 14 * * *"

# Light and frequent: eBay order ingestion + ending listings after a sale. Nothing heavy.
[functions."ebay-sync"]
  schedule = "*/2 * * * *"
  timeout = 30

# Low priority, every 15 minutes: draft refresh/quotes/reprice, category refresh, spec backfill.
# Runs as a background function behind a lock, in small paced batches that back off when the DB is busy.
[functions."ebay-drafts-refresh"]
  schedule = "*/15 * * * *"

[functions."ebay-drafts"]
  timeout = 60

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/oauth/go"
  to = "/.netlify/functions/oauth-go"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
