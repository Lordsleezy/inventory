[build]
  command = "npm install --prefix netlify --omit=dev"
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/5 * * * *"

[functions."loyalty-email"]
  schedule = "*/5 * * * *"

[functions."web-order-email"]
  schedule = "*/5 * * * *"

[functions."web-order-reconcile"]
  schedule = "*/5 * * * *"

[functions."web-pickup-sweep"]
  schedule = "*/10 * * * *"

[functions."listing-check"]
  schedule = "0 14 * * *"

# Orders-only sync: pull eBay sales into Floor every few minutes. Never pushes listings.
[functions."ebay-sync"]
  schedule = "*/3 * * * *"
  timeout = 30

[functions."ebay-drafts"]
  timeout = 60

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/api/marketplace-prices"
  to = "/.netlify/functions/marketplace-prices"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/go"
  to = "/.netlify/functions/oauth-go"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[functions."google-sync"]
schedule = "* * * * *"

[functions."google-reconcile"]
schedule = "0 */6 * * *"

[functions."marketplace-daily-report"]
schedule = "0 16 * * *"

# Reconcile real eBay marketplace fees and Square processing fees onto sales.
[functions."channel-fee-sync"]
schedule = "*/15 * * * *"
timeout = 60
