[build]
  command = "npm install --prefix netlify --omit=dev"
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/5 * * * *"

# Internal alerts are sent through Gmail SMTP (GMAIL_SMTP_USER / GMAIL_SMTP_APP_PASSWORD); web_shipped buyer mail stays on Resend.

# Gmail inbox reader: Depop / Mercari sale mail -> marketplace_ingest_sale / needs_review.
[functions."gmail-sales-poll"]
  schedule = "*/2 * * * *"
  timeout = 30
[functions."amazon-sync"]
  schedule = "*/10 * * * *"
  timeout = 60

# Amazon MFN returns report + TikTok returns → returns table / decision alerts.
[functions."returns-sync"]
  schedule = "*/30 * * * *"
  timeout = 60

[functions."tiktok-returns-sync"]
  schedule = "*/30 * * * *"
  timeout = 60

[functions."tiktok-orders-sync"]
  schedule = "*/10 * * * *"
  timeout = 60

[functions."tiktok-list"]
  timeout = 60

[functions."tiktok-webhook"]
  timeout = 30

[functions."tiktok-oauth-callback"]
  timeout = 30

# Admin Amazon queue: prepare / ASIN / price / list_one (kept off amazon-sync cron bundle).
[functions."amazon-list"]
  timeout = 60


[functions."loyalty-email"]
  schedule = "*/5 * * * *"

[functions."web-order-email"]
  schedule = "*/5 * * * *"

[functions."web-order-reconcile"]
  schedule = "*/5 * * * *"

[functions."web-pickup-sweep"]
  schedule = "*/10 * * * *"

[functions."listing-check"]
  schedule = "0 14 * * *"

# Sold-but-available and sold-but-still-listed. Emails the owner; ends eBay.
[functions."inventory-reconcile"]
  schedule = "*/15 * * * *"
  timeout = 60

# Orders-only sync: pull eBay sales into Floor every few minutes. Never pushes listings.
[functions."ebay-sync"]
  schedule = "*/3 * * * *"
  timeout = 60

# Dispatch queued ebay_migration_request → ebay-migrate-background (agent/SQL can queue without secrets).
[functions."ebay-migrate-dispatch"]
  schedule = "* * * * *"
  timeout = 20

# Background migrate worker (Netlify *-background = up to 15 minutes).
[functions."ebay-migrate-background"]
  timeout = 900

# Manual portal "Sync all accounts" / per-account sync (avoids 504 on ebay-connection).
[functions."ebay-sync-now-background"]
  timeout = 900

# Listing manager paced bulk publish.
[functions."listing-manager-background"]
  timeout = 900

[functions."listing-manager"]
  timeout = 60

# Read-only ikonikdeals2026 listing audit (ActiveList + Shippo rates + UPC retail).
[functions."ebay-listing-audit-background"]
  timeout = 900

# +$10 / free shipping bump for listings whose audit ship estimate was ≤ $10.
[functions."ebay-free-ship-bump-background"]
  timeout = 900

# List today's first-photo units (free-ship bake-in + 10% fees, else calculated).
[functions."ebay-photo-day-list-background"]
  timeout = 900

# Local-pickup first-sales batch (paced listings; up to ~15 minutes).
[functions."ebay-pickup-list-background"]
  timeout = 900

[functions."ebay-drafts"]
  timeout = 60

# Scan-to-list: Amazon catalog + pricing + UPCitemdb in one HTTP call.
[functions."upc-lookup"]
  timeout = 26

# Read-only inventory feed for marketplace listing agents. No schedule.
[functions."listing-feed"]
  timeout = 26

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/listing-feed"
  to = "/.netlify/functions/listing-feed"
  status = 200
  force = true

[[redirects]]
  from = "/api/marketplace-prices"
  to = "/.netlify/functions/marketplace-prices"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/go"
  to = "/.netlify/functions/oauth-go"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[functions."google-sync"]
schedule = "* * * * *"

[functions."google-reconcile"]
schedule = "0 */6 * * *"

[functions."marketplace-daily-report"]
schedule = "0 16 * * *"

# Safety net: sale emails without an Orders row within 10 minutes → alert + backfill.
[functions."marketplace-sale-watch"]
schedule = "*/5 * * * *"
timeout = 30

# Reconcile real eBay marketplace fees and Square processing fees onto sales.
[functions."channel-fee-sync"]
schedule = "*/15 * * * *"
timeout = 60
