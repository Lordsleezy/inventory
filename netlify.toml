[build]
  command = "npm install --prefix netlify --omit=dev"
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/5 * * * *"

[functions."ebay-sync"]
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/.netlify/functions/oauth-callback/"
  to = "/.netlify/functions/oauth-callback"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
